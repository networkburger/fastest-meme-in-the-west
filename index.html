<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d14" />
    <meta name="description" content="Make a meme in seconds. Private, ad-free, nothing leaves your device." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%A0%3C/text%3E%3C/svg%3E" />
    <title>Fastest Meme in the West</title>
    <!-- The grid is prerendered into #root. On a deep link (#/t/…) hide it
         until the app has rendered the right page, instead of flashing the grid. -->
    <script>
      if (/^#\/./.test(location.hash)) {
        document.documentElement.dataset.deeplink = '';
        // Fetch what the page will need now, in parallel with the app's JS
        // (the build fills in the library URL and each template's image).
        var preload = function (href, as, cors) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = as;
          link.href = href;
          if (cors) link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        };
        var library = '__FMITW_LIBRARY_URL__';
        var images = __FMITW_IMAGES__;
        var template = /^#\/t\/([^/]+)$/.exec(location.hash);
        if (template) {
          if (library) preload(library, 'fetch', true);
          preload('fonts/anton-latin.woff2', 'font', true);
          try {
            var image = images[decodeURIComponent(template[1])];
            if (image) preload(image, 'image');
          } catch (e) {}
        }
      }
    </script>
    <style>
      [data-deeplink] #root { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
